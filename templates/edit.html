<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>Edit Student {{ student[0] }}</h1>
    <form method="post">
        <input type="text" name="name" value="{{ student[1] }}" required><br>
        <input type="email" name="email" value="{{ student[2] }}" required><br>
        <input type="text" name="branch" value="{{ student[3] }}" required><br>
        <input type="password" name="password" placeholder="Change password (optional)"><br>
        <button type="submit" class="btn">Update</button>
        <a href="{{ url_for('admin_home') }}" class="btn back-link">Cancel</a>
    </form>
</div>
</body>
</html>
