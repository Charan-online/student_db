<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>Delete Student</h1>
    <p>Are you sure you want to delete <strong>{{ student[1] }}</strong> ({{ student[0] }})?</p>
    <form method="post" action="{{ url_for('admin_confirm_delete', roll_no=student[0]) }}">
        <button type="submit" class="btn delete-btn">Yes, Delete</button>
        <a href="{{ url_for('admin_home') }}" class="btn back-link">Cancel</a>
    </form>
</div>
</body>
</html>
