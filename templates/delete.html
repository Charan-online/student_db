<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>❌ Delete Student</h1>

    {% if student %}
    <p>Are you sure you want to delete <strong>{{ student[1] }}</strong> (Roll No: {{ student[0] }})?</p>

    <div class="confirm-buttons">
        <form method="POST" action="/confirm_delete/{{ student[0] }}" style="display:inline;">
            <button type="submit" class="delete-btn">Yes, Delete</button>
        </form>
        <a class="back-link" href="/">No, Cancel</a>
    </div>
    {% else %}
    <p class="error">❌ Student not found!</p>
    <a class="back-link" href="/">Back to Home</a>
    {% endif %}
</div>
</body>
</html>
