<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Home</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>Admin Dashboard</h1>
    <a href="{{ url_for('admin_add') }}" class="btn">Add Student</a>
    <a href="{{ url_for('logout') }}" class="btn">Logout</a>

    <table>
        <thead>
            <tr>
                <th>Roll No</th>
                <th>Name</th>
                <th>Email</th>
                <th>Branch</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for s in students %}
            <tr>
                <td>{{ s[0] }}</td>
                <td>{{ s[1] }}</td>
                <td>{{ s[2] }}</td>
                <td>{{ s[3] }}</td>
                <td>
                    <a href="{{ url_for('admin_edit', roll_no=s[0]) }}" class="edit-btn">Edit</a>
                    <a href="{{ url_for('admin_delete_confirm', roll_no=s[0]) }}" class="delete-btn">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
